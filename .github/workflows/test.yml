name: test

on:
  push:
  pull_request:

jobs:
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]   # exercise both the GNU and BSD stat/bash paths
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run devflow harness
        run: bash test/run.sh   # stdlib python3 only — no PyYAML, no jq
