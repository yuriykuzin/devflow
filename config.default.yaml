# Devflow default configuration
# Copy to ~/.devflow/config.yaml and customize as needed.
# Per-project overrides: place .devflow.yaml in project root.

# ──────────────────────────────────────────────────────────────
# EXECUTION PROFILES — devflow's process roles bound to a host tool's agents
# ──────────────────────────────────────────────────────────────
# `roles` maps devflow's process roles (implementer/reviewer/verifier) onto a host subagent
# name; an empty `agent: ""` means "use the default execution path" (host personas/CLI, exactly
# today's behaviour). `review.max_passes` caps how many reviewer passes a single deliverable may
# consume (0 = unlimited = current behaviour); passes are counted per deliverable, not per phase,
# so `implement` and `run`'s re-review of the same result share one budget.
#
# The budget is FIXED for a deliverable's life by `scripts/devflow-runner.sh passes init
# --deliverable <id> --max <n>` — the one place `max_passes` is written to disk. `passes reserve`
# no longer takes a `--max` flag; it only reads the value `init` wrote, and refuses to charge
# a deliverable that was never initialized (`BUDGET_NOT_INITIALIZED`) rather than default to
# unlimited. On the unbound path (no `roles.*.agent` set), one review round costs (personas +
# external calls) passes, not one — set `max_passes` at least that high, or bind
# `roles.reviewer.agent` to a single named agent to make a round cost exactly one pass.
#
# TRUST RULE (same as codex.command_path below): `roles.*.agent`, `review.max_passes`, and
# `review.fallback_to_host` are read from ~/.devflow/config.yaml and this file ONLY. A
# project-level .devflow.yaml can NEVER set them — a cloned repo must not be able to redirect
# devflow's role bindings or lift its own review budget. `roles.reviewer.lens` is NOT
# trust-restricted (it just names which lens a pass used for the report).
#
# Absence of a key is NOT the same as `agent: ""` — the former means "this layer didn't decide",
# the latter explicitly selects the default path. Without a profile installed, nothing here
# changes devflow's behaviour: no agent bindings, no pass limit.
profile_version: 1
roles:
  implementer: { agent: "" }   # host subagent name; "" = default execution path
  reviewer:    { agent: "", lens: "" }
  verifier:    { agent: "" }
review:
  max_passes: 0                # 0 = unlimited (current behaviour); passes are counted per deliverable
  fallback_to_host: false      # true = an unresolvable named agent falls back to the default path

# EXECUTOR MANIFEST — an execution layer's role bindings, published as an agnostic contract
# (see docs/contracts/executor-manifest-v1.md). Path to a manifest file; "" = no manifest (the
# `roles`/`review` above are the only source, as today). Global-only, same trust rule as `roles`
# above and `codex.command_path` — a project .devflow.yaml can never set this. When set and the
# file exists, the manifest's `roles` and `budgets.review_passes`/`budgets.fallback_to_host`
# override the inline `roles`/`review` above; the inline block stays as a fallback for anyone
# without a manifest installed.
executor_manifest: ""

# ──────────────────────────────────────────────────────────────
# EXTERNAL REVIEW — resolved by HOST, not by one global switch
# ──────────────────────────────────────────────────────────────
# The value of an external review is a DIFFERENT tool's eyes, so which backend to call
# depends on which tool is hosting the run. `none` means: run internal personas only and
# close the review on their synthesis — there is no external verdict to wait for.
external_review:
  from_claude: codex           # hosted by Claude Code → external review via the codex CLI
  from_codex: none             # hosted by Codex → internal personas only, no external call
# `backend:` below stays the fallback for a host not listed here, and still selects the
# implementer backend for handoff calls.

# ──────────────────────────────────────────────────────────────
# BACKEND SELECTOR — change this one line to switch everything
# ──────────────────────────────────────────────────────────────
backend: claude              # codex | claude

# ──────────────────────────────────────────────────────────────
# Backend: claude (Claude Code CLI)
# ──────────────────────────────────────────────────────────────
claude:
  # Only model/effort/session_reuse are live knobs. The CLI invocation itself (flags, headless
  # mode, session capture, read-only vs write posture) is built by the runner — see the canonical
  # procedure in skills/using-devflow/references/cross-tool-runner.md.
  reviewer:
    model: "opus"                    # alias: opus → claude-opus-4-6
    effort: "max"                    # --effort max (thorough reviews)
  implementer:
    model: "sonnet"                  # alias: sonnet → claude-sonnet-4-6
    effort: "high"                   # --effort high (fast implementation)
  session_reuse: true

# ──────────────────────────────────────────────────────────────
# Backend: codex (Codex CLI)
# ──────────────────────────────────────────────────────────────
codex:
  # Absolute path to the Rust codex CLI. Empty = auto-resolve & validate: devflow picks
  # the first candidate whose `exec --help` advertises `--json` (preferring Homebrew
  # /opt/homebrew/bin/codex), detecting & skipping an NVM-shadowed old CLI that lacks
  # --json and needs TTY auth. Set an absolute path to force a specific binary; devflow
  # fails loudly if no candidate supports `exec --json`.
  command_path: ""
  # Only model/effort/session_reuse (and the exec-path key command_path) are live knobs.
  # The CLI invocation itself is built by the runner — see the canonical procedure in
  # skills/using-devflow/references/cross-tool-runner.md.
  reviewer:
    model: "gpt-5.6-terra"           # the model devflow reviews WITH when the host is Claude
    effort: "high"                   # via -c 'model_reasoning_effort="..."'
  implementer:
    model: "gpt-5.5"
    effort: "high"                   # via -c 'model_reasoning_effort="..."'
  session_reuse: true

# ──────────────────────────────────────────────────────────────
# Shared settings (apply regardless of backend)
# ──────────────────────────────────────────────────────────────

# Default autonomy mode
# attended    — ask user on ambiguity (default)
# unattended  — never ask, make best-effort decisions
autonomy: attended

# Where to save reports and artifacts
output_dir: "docs/devflow/reports"

# ──────────────────────────────────────────────────────────────
# Multi-persona review
#
# Internal review (host agent) spawns persona sub-agents in
# parallel. External review (CLI) runs a single generalist
# reviewer for an independent second opinion. Two axes of
# diversity: personas × tools.
#
# See skills/devflow-review/references/review-personas.md
# ──────────────────────────────────────────────────────────────
review_personas:
  enabled: true                       # false → single-reviewer fallback prompt
  # Which personas to spawn for internal multi-persona review.
  # External review always uses the single generalist prompt.
  # Three by default: in practice these are the lenses that find defects rather than
  # preferences. readability / performance / conservator are still supported — add them back
  # here when a changeset actually calls for that lens.
  personas:
    - architect                       # Martin Fowler — design, patterns, SOLID
    - security                        # Ethical Hacker — OWASP, injection, auth
    - qa                              # Devil's Advocate — edge cases, error paths, races

  # ── Persona effort tiers ──────────────────────────────────
  # Not all personas need the heaviest model. Security and
  # Architect require deep creative reasoning (opus/max).
  # Others need thoroughness but not raw intelligence (sonnet/max).
  #
  # Each persona maps to a tier; each tier defines model+effort
  # per backend. Unrecognized personas default to "standard".
  persona_tiers:
    deep:                             # creative reasoning, adversarial thinking
      personas: [architect, security]
      claude:
        model: "opus"
        effort: "max"
      codex:
        effort: "high"
    standard:                         # thorough but less expensive
      personas: [qa, readability, performance, conservator]
      claude:
        model: "sonnet"
        effort: "max"
      codex:
        effort: "high"

# Tool integrations — comment out to skip during install/uninstall.
# If this section is absent, all detected tools are installed.
integrations:
  codex: true
  claude-code: true
  opencode: true
  # cursor: true       # auto-detected from repo — no install step needed
  # gemini: true       # auto-detected from repo — no install step needed
